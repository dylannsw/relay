[package]
name = "relay"
version = "0.1.0"
description = "Unified inbox for Gmail and Microsoft accounts"
edition = "2021"
default-run = "relay"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
reqwest = { version = "0.13", features = ["json", "form", "query"] }
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.11"
base64 = "0.23"
url = "2"
chrono = "0.4"
thiserror = "2"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
encoding_rs = "0.8"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
rrule = "0.14"
chrono-tz = "0.10"
psl = "2.1.251"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
