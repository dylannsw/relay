[package]
name = "relay"
version = "0.1.0"
description = "Unified inbox for Gmail and Microsoft accounts"
edition = "2021"
default-run = "relay"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
tempfile = "3"
percent-encoding = "2"
http-range = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
reqwest = { version = "0.13", features = ["json", "form", "query"] }
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.11"
base64 = "0.23"
url = "2"
chrono = "0.4"
thiserror = "2"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
encoding_rs = "0.8"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
rrule = "0.14"
chrono-tz = "0.10"
psl = "2.1.251"
# Telegram: a pure-Rust MTProto client (no native library to ship).
grammers-client = "0.12"
grammers-mtsender = "0.12"
grammers-session = { version = "0.12", default-features = false, features = ["serde"] }
grammers-tl-types = "0.12"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Foundation", "Globalization", "Media_SpeechRecognition"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
